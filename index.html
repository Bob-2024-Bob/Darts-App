<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Congress B Darts - Scoring</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="top-nav">
  <div class="nav-title">Congress B Darts</div>
  <div class="nav-links">
    <a href="index.html">Scoring</a>
    <a href="history.html">History</a>
    <a href="stats.html">Stats</a>
  </div>
</nav>

<h1>Live Scoring</h1>

<div class="scoreboard">
  <div class="team-card" id="team-0-card">
    <h2 id="t0-evening-name">Congress B</h2>
    <p>Legs Won: <span id="t0-evening-score">0</span></p>
  </div>

  <div class="team-card" id="team-1-card">
    <h2 id="t1-evening-name">Opponents</h2>
    <p>Legs Won: <span id="t1-evening-score">0</span></p>
  </div>
</div>

<div class="scoreboard">
  <div class="team-card">
    <h3 id="t0-name">Congress B</h3>
    <p>Player: <span id="t0-player-indicator">Player 1</span></p>
    <p>Score: <span id="t0-score">501</span></p>
    <p>Checkout: <span id="t0-checkout"></span></p>
    <p>Legs: <span id="t0-legs">0</span></p>
  </div>

  <div class="team-card">
    <h3 id="t1-name">Opponents</h3>
    <p>Player: <span id="t1-player-indicator">Opponent 1</span></p>
    <p>Score: <span id="t1-score">501</span></p>
    <p>Checkout: <span id="t1-checkout"></span></p>
    <p>Legs: <span id="t1-legs">0</span></p>
  </div>
</div>

<h2>Score Entered: <span id="input-buffer">0</span></h2>

<div class="keypad">
  <button class="btn-num" data-val="1">1</button>
  <button class="btn-num" data-val="2">2</button>
  <button class="btn-num" data-val="3">3</button>
  <button class="btn-num" data-val="4">4</button>
  <button class="btn-num" data-val="5">5</button>
  <button class="btn-num" data-val="6">6</button>
  <button class="btn-num" data-val="7">7</button>
  <button class="btn-num" data-val="8">8</button>
  <button class="btn-num" data-val="9">9</button>
  <button class="btn-num" data-val="0">0</button>
</div>

<button id="btn-clear" class="btn-primary">Clear</button>
<button id="btn-enter" class="btn-primary">Enter Score</button>
<button id="btn-new-match" class="btn-primary">New Match Setup</button>

<!-- Setup Modal -->
<div class="modal-overlay hidden" id="setup-modal">
  <div class="modal-box">
    <h2>Match Setup</h2>

    <label>Home Team</label>
    <input type="text" id="setup-t0-name" value="Congress B">

    <label>Away Team</label>
    <input type="text" id="setup-t1-name" value="Opponents">

    <label>Home Player</label>
    <input type="text" id="setup-p0-name" value="Player 1">

    <label>Away Player</label>
    <input type="text" id="setup-p1-name" value="Opponent 1">

    <button id="btn-save-setup" class="btn-primary">Save & Start Match</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
