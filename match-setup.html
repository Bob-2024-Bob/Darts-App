<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Match Setup & Roster</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .setup-wrapper {
      max-width: 850px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .roster-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .roster-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 0.75rem;
    }

    .roster-input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .roster-input-group input,
    .roster-input-group select {
      flex: 1;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    .action-btn {
      padding: 0.65rem 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-btn { background: #22c55e; color: #052e16; }

    .player-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .player-chip {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .player-chip button {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: bold;
      cursor: pointer;
    }

    .match-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: #1e293b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      border: 1px solid #2a354d;
    }

    .match-type-badge {
      width: 110px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 0.9rem;
    }

    .match-row select, .match-row input {
      flex: 1;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    .reorder-btns {
      display: flex;
      gap: 4px;
    }

    .reorder-btns button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .reorder-btns button:hover {
      background: #475569;
    }

    .save-schedule-btn {
      width: 100%;
      padding: 0.85rem;
      background: #22c55e;
      color: #052e16;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .setup-header-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 600px) {
      .setup-header-group {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

<header class="app-header">
  <nav class="top-nav">
    <a href="match-setup.html" class="active">Setup</a>
    <a href="index.html">Scoring</a>
    <a href="stats.html">Stats</a>
  </nav>
  <h1>MATCH SETUP & ROSTER</h1>
</header>

<main class="setup-wrapper">
    <!-- Casual / Friendly Match Setup Section -->
<div class="setup-card casual-card" style="background: #1e293b; border: 2px dashed #38bdf8; padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem;">
  <h2 style="color: #38bdf8; margin-top: 0;">🎯 Quick Play / Friendly Mode</h2>
  <p style="color: #94a3b8; font-size: 0.95rem;">Play a quick game without recording any official player stats or league averages.</p>
  
  <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
    <input type="text" id="casual-p1" placeholder="Player 1 Name" style="flex: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
    <input type="text" id="casual-p2" placeholder="Player 2 Name" style="flex: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
  </div>
    <button onclick="launchCasual()" style="width: 100%; padding: 0.85rem; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">
    START CASUAL GAME 🎯
  </button>
</div>

</main>

<main class="setup-wrapper">

  <!-- Team Roster Management -->
  <section class="roster-card">
    <div class="roster-title">Congress B Roster Management</div>
    <div class="roster-input-group">
      <input type="text" id="new-player-name" placeholder="Enter new player name..." />
      <button class="action-btn add-btn" onclick="addPlayerToRoster()">Add Player</button>
    </div>
    <div id="player-chips-container" class="player-tags"></div>
  </section>



<script>
function launchCasual() {
  var p1 = document.getElementById("casual-p1").value || "Player 1";
  var p2 = document.getElementById("casual-p2").value || "Player 2";
  startCasualMatch(p1, p2);
}
</script>

  <!-- Match Fixtures & Format Setup -->
  <section class="roster-card">
    <div class="roster-title">Match Configuration</div>
    
    <div class="setup-header-group">
      <!-- Format Selector -->
      <div style="flex: 1;">
        <label style="display: block; color: #94a3b8; margin-bottom: 4px; font-size: 0.85rem;">Match Format:</label>
        <select id="match-format-select" onchange="changeMatchFormat()" style="width: 100%; padding: 0.65rem; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
          <option value="full">Full Night (4 Singles, 2 Doubles, 1 Reserve)</option>
          <option value="singles_doubles">Singles & Doubles (4 Singles, 2 Doubles)</option>
          <option value="singles_only">Singles Only (4 Matches)</option>
        </select>
      </div>

      <!-- Opponent Team Name Input -->
      <div style="flex: 1;">
        <label style="display: block; color: #94a3b8; margin-bottom: 4px; font-size: 0.85rem;">Opponent Team Name:</label>
        <input type="text" id="opponent-team-name" placeholder="e.g. Royal Oak B" style="width: 100%; padding: 0.65rem; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" />
      </div>
    </div>

    <!-- Container for dynamic match inputs -->
    <div id="setup-schedule-list"></div>

    <button class="save-schedule-btn" onclick="saveSchedule()">Save Schedule</button>
  </section>
</main>

<script src="app.js"></script>
<script>
  
  // Format Presets
  var formatPresets = {
    full: [
      { title: "Singles 1", isDouble: false },
      { title: "Singles 2", isDouble: false },
      { title: "Singles 3", isDouble: false },
      { title: "Singles 4", isDouble: false },
      { title: "Doubles 1", isDouble: true },
      { title: "Doubles 2", isDouble: true },
      { title: "Reserve", isDouble: false }
    ],
    singles_doubles: [
      { title: "Singles 1", isDouble: false },
      { title: "Singles 2", isDouble: false },
      { title: "Singles 3", isDouble: false },
      { title: "Singles 4", isDouble: false },
      { title: "Doubles 1", isDouble: true },
      { title: "Doubles 2", isDouble: true }
    ],
    singles_only: [
      { title: "Singles 1", isDouble: false },
      { title: "Singles 2", isDouble: false },
      { title: "Singles 3", isDouble: false },
      { title: "Singles 4", isDouble: false }
    ]
  };

  var activeFixtures = [];

  function getRoster() {
    return JSON.parse(localStorage.getItem("congressPlayers") || "[]");
  }

  function renderRosterChips() {
    var container = document.getElementById("player-chips-container");
    if (!container) return;
    container.innerHTML = "";
    var roster = getRoster();

    if (roster.length === 0) {
      container.innerHTML = "<span style='color: #64748b;'>No players added to roster yet.</span>";
      return;
    }

    roster.forEach(function(p, index) {
      var chip = document.createElement("div");
      chip.className = "player-chip";
      chip.innerHTML = `<span>${p.name}</span> <button onclick="removePlayerFromRoster(${index})">✕</button>`;
      container.appendChild(chip);
    });
  }

  function addPlayerToRoster() {
    var input = document.getElementById("new-player-name");
    var name = input.value.trim();
    if (!name) return;

    var roster = getRoster();
    if (!roster.some(function(p) { return p.name.toLowerCase() === name.toLowerCase(); })) {
      roster.push({ name: name });
      localStorage.setItem("congressPlayers", JSON.stringify(roster));
      input.value = "";
      renderRosterChips();
      renderScheduleForm();
    }
  }

  function removePlayerFromRoster(index) {
    var roster = getRoster();
    roster.splice(index, 1);
    localStorage.setItem("congressPlayers", JSON.stringify(roster));
    renderRosterChips();
    renderScheduleForm();
  }

  function changeMatchFormat() {
    var selectedFormat = document.getElementById("match-format-select").value;
    activeFixtures = JSON.parse(JSON.stringify(formatPresets[selectedFormat] || formatPresets.full));
    localStorage.setItem("selectedFormatKey", selectedFormat);
    renderScheduleForm();
  }

  function renderScheduleForm() {
    var container = document.getElementById("setup-schedule-list");
    if (!container) return;
    container.innerHTML = "";

    var savedSchedule = JSON.parse(localStorage.getItem("matchSchedule") || "[]");
    var savedOpponent = localStorage.getItem("opponentTeamName") || "";
    document.getElementById("opponent-team-name").value = savedOpponent;

    var roster = getRoster();

    activeFixtures.forEach(function(fix, i) {
      var matchData = savedSchedule[i] || { homePlayer: "", awayPlayer: "" };
      var div = document.createElement("div");
      div.className = "match-row";

      var optionsHtml = '<option value="">Select Player...</option>';
      roster.forEach(function(p) {
        optionsHtml += '<option value="' + p.name + '">' + p.name + '</option>';
      });

      var flexContent = '';
      if (fix.isDouble) {
        var existingPair = (matchData.homePlayer || "").split("&").map(function(s) { return s.trim(); });
        flexContent = `
          <select id="home-player-1-${i}">${optionsHtml}</select>
          <select id="home-player-2-${i}">${optionsHtml}</select>
        `;
      } else {
        flexContent = `<select id="home-player-1-${i}">${optionsHtml}</select>`;
      }

      div.innerHTML = `
        <span class="match-type-badge">${fix.title}</span>
        ${flexContent}
        <input type="text" id="away-player-${i}" placeholder="Opponent Name" value="${matchData.awayPlayer || ''}" />
        <div class="reorder-btns">
          ${i > 0 ? `<button type="button" onclick="moveMatchUp(${i})">▲</button>` : ''}
          ${i < activeFixtures.length - 1 ? `<button type="button" onclick="moveMatchDown(${i})">▼</button>` : ''}
        </div>
      `;

      container.appendChild(div);

      // Restore selections
      if (fix.isDouble) {
        var existingPair = (matchData.homePlayer || "").split("&").map(function(s) { return s.trim(); });
        if (existingPair[0]) document.getElementById("home-player-1-" + i).value = existingPair[0];
        if (existingPair[1]) document.getElementById("home-player-2-" + i).value = existingPair[1];
      } else {
        if (matchData.homePlayer) document.getElementById("home-player-1-" + i).value = matchData.homePlayer;
      }
    });
  }

  function captureCurrentInputs() {
    var scheduleData = [];
    activeFixtures.forEach(function(fix, i) {
      var p1Elem = document.getElementById("home-player-1-" + i);
      var awayElem = document.getElementById("away-player-" + i);
      var p1 = p1Elem ? p1Elem.value : "";
      var awayVal = awayElem ? awayElem.value : "";
      var homeCombined = p1;

      if (fix.isDouble) {
        var p2Elem = document.getElementById("home-player-2-" + i);
        var p2 = p2Elem ? p2Elem.value : "";
        homeCombined = p1 && p2 ? p1 + " & " + p2 : (p1 || p2 || "");
      }

      scheduleData.push({
        title: fix.title,
        isDouble: fix.isDouble,
        homePlayer: homeCombined,
        awayPlayer: awayVal
      });
    });
    return scheduleData;
  }

  function moveMatchUp(index) {
    if (index <= 0) return;
    var currentData = captureCurrentInputs();
    
    // Swap fixtures
    var tempFix = activeFixtures[index];
    activeFixtures[index] = activeFixtures[index - 1];
    activeFixtures[index - 1] = tempFix;

    // Swap data
    var tempData = currentData[index];
    currentData[index] = currentData[index - 1];
    currentData[index - 1] = tempData;

    localStorage.setItem("matchSchedule", JSON.stringify(currentData));
    renderScheduleForm();
  }

  function moveMatchDown(index) {
    if (index >= activeFixtures.length - 1) return;
    var currentData = captureCurrentInputs();

    // Swap fixtures
    var tempFix = activeFixtures[index];
    activeFixtures[index] = activeFixtures[index + 1];
    activeFixtures[index + 1] = tempFix;

    // Swap data
    var tempData = currentData[index];
    currentData[index] = currentData[index + 1];
    currentData[index + 1] = tempData;

    localStorage.setItem("matchSchedule", JSON.stringify(currentData));
    renderScheduleForm();
  }

function saveSchedule() {
  // 1. Explicitly turn off Casual Mode & clear temporary casual names
  localStorage.setItem("isCasualMode", "false");
  localStorage.removeItem("skipBullOff");
  localStorage.removeItem("casualPlayer1");
  localStorage.removeItem("casualPlayer2");

  // 2. Your existing official schedule capturing logic
  var finalSchedule = captureCurrentInputs();
  var oppTeamName = document.getElementById("opponent-team-name").value.trim() || "Opponent Team";

  localStorage.setItem("matchSchedule", JSON.stringify(finalSchedule));
  localStorage.setItem("opponentTeamName", oppTeamName);

  alert("Match Schedule & Opponent Saved!");
}

  document.addEventListener("DOMContentLoaded", function() {
    var savedFormat = localStorage.getItem("selectedFormatKey") || "full";
    document.getElementById("match-format-select").value = savedFormat;
    activeFixtures = JSON.parse(JSON.stringify(formatPresets[savedFormat] || formatPresets.full));

    renderRosterChips();
    renderScheduleForm();
  });

</script>
</body>
</html>
<script>
    // Paste the launchCasual() function right here!
    function launchCasual() {
      var p1Input = document.getElementById("casual-p1");
      var p2Input = document.getElementById("casual-p2");
      
      var p1 = (p1Input && p1Input.value.trim()) ? p1Input.value.trim() : "Player 1";
      var p2 = (p2Input && p2Input.value.trim()) ? p2Input.value.trim() : "Player 2";
      
      if (typeof startCasualMatch === "function") {
        startCasualMatch(p1, p2);
      } else {
        localStorage.setItem("isCasualMode", "true");
        localStorage.setItem("opponentTeamName", p2);
        var casualSchedule = [{ title: "Casual Game", homePlayer: p1, awayPlayer: p2 }];
        localStorage.setItem("matchSchedule", JSON.stringify(casualSchedule));
        localStorage.setItem("currentMatchIndex", "0");
        localStorage.setItem("congressLegs", "0");
        localStorage.setItem("opponentLegs", "0");
        localStorage.setItem("congressScore", "501");
        localStorage.setItem("opponentScore", "501");
        localStorage.setItem("turnHistory", "[]");
        localStorage.setItem("activeSide", "congress");
        window.location.href = "index.html";
      }
    }
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="app.js">
  
  </script>
</body>
</html>
